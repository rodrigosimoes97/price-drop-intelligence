name: run-price-monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COMMIT_REPORTS: ${{ vars.COMMIT_REPORTS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        run: python -m app.run --mode live

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: price-drop-${{ github.run_id }}
          path: |
            data/prices.db
            reports/*
            logs/*

      - name: Commit reports
        if: env.COMMIT_REPORTS == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md reports/latest.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update price reports"
          git push
