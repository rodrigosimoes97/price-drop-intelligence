name: run-discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    env:
      COMMIT_REPORTS: ${{ vars.COMMIT_REPORTS }}
      SHOPEE_AFFILIATE_API_BASE: ${{ secrets.SHOPEE_AFFILIATE_API_BASE }}
      SHOPEE_AFFILIATE_TOKEN: ${{ secrets.SHOPEE_AFFILIATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Debug Shopee API connectivity
        if: env.DEBUG_NETWORK == 'true'
        env:
          DEBUG_NETWORK: ${{ vars.DEBUG_NETWORK }}
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request
          keyword = urllib.parse.quote('balanca digital')
          url = f"https://shopee.com.br/api/v4/search/search_items?by=sales&keyword={keyword}&limit=1&newest=0&order=desc&page_type=search&scenario=PAGE_GLOBAL_SEARCH&version=2"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0", "Accept":"application/json"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              print(f"DEBUG Shopee API status={resp.status}")
          PY

      - name: Run discovery
        run: python -m app.discovery.run_discovery --store shopee --country BR --max-active 100
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: |
            data/prices.db
            reports/discovery_*
            logs/*
      - name: Commit discovery reports
        if: env.COMMIT_REPORTS == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/discovery_latest.md reports/discovery_latest.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update discovery reports"
          git push
