name: run-discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    env:
      COMMIT_REPORTS: ${{ vars.COMMIT_REPORTS }}
      SHOPEE_AFFILIATE_API_BASE: ${{ secrets.SHOPEE_AFFILIATE_API_BASE }}
      SHOPEE_AFFILIATE_TOKEN: ${{ secrets.SHOPEE_AFFILIATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Network smoke test (Shopee)
        run: |
            python - <<'PY'
            import urllib.request, ssl
            urls = [
              "https://shopee.com.br/",
              "https://shopee.com.br/search?keyword=fone%20bluetooth",
            ]
            for u in urls:
              try:
                with urllib.request.urlopen(u, timeout=20, context=ssl.create_default_context()) as r:
                  print(u, "->", r.status)
              except Exception as e:
                print(u, "-> ERROR:", repr(e))
            PY
      - name: Run discovery
        run: python -m app.discovery.run_discovery --store shopee --country BR --max-active 100
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: |
            data/prices.db
            reports/discovery_*
            logs/*
      - name: Commit discovery reports
        if: env.COMMIT_REPORTS == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/discovery_latest.md reports/discovery_latest.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update discovery reports"
          git push
